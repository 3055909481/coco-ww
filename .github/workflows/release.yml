# 推到 main 的提交里 config.py 的版本号变了 -> 自动发混淆版 Release。
#
# release 里分发的是"混淆 + 带运行环境"的整包，以及在线更新清单：
#   1. 构建混淆产物到 build/release（src/ pyappify/ 全部变成 .pyc，内置角色源码加密另存）
#   2. 把产物推到 obfuscated 分支（在线更新按提交号从该分支 raw 下载，拿到的就是 .pyc）
#   3. 用混淆产物 + Python 3.12 运行环境打整包 coco-ww-vX.Y.Z.zip（含 Windows 专属依赖，
#      所以 runner 必须是 windows-latest）
#   4. 清单基于产物目录生成，commit 指向 obfuscated 分支的提交
#   5. Release 同时挂整包 zip 和 update-manifest.json
# 版本号没变（或这个 tag 已经有了）就什么都不做。
name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'config.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    # Windows 专属依赖（pywin32/comtypes/pycaw）只能在 Windows 上装，整包必须在这里打
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' config.py | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "tag $version 已经有了, 不发"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -1)
          newest=$(printf '%s\n%s\n' "$prev" "$version" | sort -V | tail -1)
          if [ -n "$prev" ] && [ "$newest" != "$version" ]; then
            echo "::error::版本号 $version 不比上一版 $prev 新, 不发"
            exit 1
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build obfuscated release tree
        if: steps.ver.outputs.skip == 'false'
        # setup-python 装好的 3.12 就是 python，显式传入避免 py launcher 认不到
        run: python tools/obfuscate_build.py --out build/release --python "python"

      - name: Pack full release zip (with Python runtime)
        id: pack
        if: steps.ver.outputs.skip == 'false'
        run: |
          python tools/pack_release.py --obf-dir build/release --python "python" --out "build/coco-ww-${{ steps.ver.outputs.version }}.zip"
          echo "zip=build/coco-ww-${{ steps.ver.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - name: Publish obfuscated tree to branch
        id: obf
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd build/release
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b obfuscated
          # .gitignore 里有 *.pyc；产物分支必须强制添加，否则 pyc 全被跳过
          git add -A -f
          git commit -q -m "obfuscated release ${{ steps.ver.outputs.version }}"
          # obfuscated 分支每次整棵覆盖：用 force push，历史不需要保留
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q -f origin obfuscated
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "obfuscated 分支提交: $sha"

      - name: Build manifest and notes
        if: steps.ver.outputs.skip == 'false'
        # 清单输出到 build/release 之外，避免把清单文件本身算进清单
        run: |
          python tools/release_manifest.py build/manifest \
            --from-dir build/release \
            --commit "${{ steps.obf.outputs.sha }}" \
            --source-commit "${{ github.sha }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --prev-tag "${{ steps.ver.outputs.prev }}"

      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "$v" \
            "${{ steps.pack.outputs.zip }}" \
            build/manifest/update-manifest.json \
            --target "$GITHUB_SHA" --title "coco-ww $v" --notes-file build/manifest/notes.md --latest
